<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIRECCIÓN GENERAL DE MIGRACIÓN</title>
    <base href="/" />

    <!-- Favicon Oficial -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Estilos Base y Blazor Scoped CSS -->
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="GestionSolicitudes.Client.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- Tipografía Institucional -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Ha ocurrido un error inesperado.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- 1. SweetAlert2 -->
    <script src="_content/CurrieTechnologies.Razor.SweetAlert2/sweetAlert2.min.js"></script>

    <!-- 2. Motor Global ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <!-- 3. Framework Blazor WebAssembly -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- 4. Script para cerrar menú exterior -->
    <script>
        window.registerOutsideClickHandler = (dotNetHelper) => {
            document.addEventListener('click', function (event) {
                const container = document.getElementById('user-dropdown-container');
                if (container && !container.contains(event.target)) {
                    dotNetHelper.invokeMethodAsync('CerrarMenuExterno');
                }
            });
        };
    </script>
</body>
</html>
